services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: review
      POSTGRES_PASSWORD: review
      POSTGRES_DB: review_dashboard
    volumes:
      - ./backend/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review -d review_dashboard"]
      interval: 3s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    # Loads GEMINI_API_KEY from data_preprocessing/.env (same key used for BERTopic naming)
    env_file:
      - ../data_preprocessing/.env
    environment:
      REVIEWS_CSV: /data/processed/reviews_processed.csv
      TOPICS_JSON: /data/topics/topics_by_journey.json
      DATABASE_URL: postgresql://review:review@db:5432/review_dashboard
    volumes:
      - ../data_preprocessing/processed_data:/data/processed:ro
      - ../data_preprocessing/topic_modeling/output:/data/topics:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
